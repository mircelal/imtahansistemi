version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      # Boş: axios /api istifadə edir; Vite proxy backend konteynerinə yönləndirir
      - VITE_API_BASE_URL=
      - VITE_PROXY_API=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      omr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  omr-service:
    build:
      context: .
      dockerfile: omr-service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # 0 = nproc (host CPU); sabit limit yoxdur — server böyüdükcə sürətlənir
      - OMR_UVICORN_WORKERS=${OMR_UVICORN_WORKERS:-0}
      - OMR_EARLY_EXIT=${OMR_EARLY_EXIT:-1}
      - OMR_MAX_VARIANTS=${OMR_MAX_VARIANTS:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: ./backend
    entrypoint: ["/bin/sh", "/app/scripts/celery_entrypoint.sh"]
    command: []
    environment:
      - SKIP_ALEMBIC=1
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-0}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      omr-service:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  imtahan_frontend_node_modules:
