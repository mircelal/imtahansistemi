version: "3.9"

# İnkişaf: kod dəyişiklikləri dərhal görünsün deyə bind mount.
# İşə salma: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  # frontend: əsas docker-compose.yml-də artıq bind mount + node_modules həcmi var

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

  omr-service:
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./omr-service:/app

  worker:
    build:
      context: ./backend
    command: celery -A app.celery_worker.celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./backend:/app
