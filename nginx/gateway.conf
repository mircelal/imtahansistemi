# Cloudflare / public domain üçün tək giriş nöqtəsi.
# Cloudflare DNS: A record → server IP, proxy ON (narıncı bulud).
# SSL/TLS: Flexible (CF→origin HTTP) və ya Full (origin-da da TLS lazımdır).

# Tunnel/Cloudflare: boş X-Forwarded-Proto gələndə https say (520 / redirect problemlərinin qarşısı).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # Docker embedded DNS — container recreate-dən sonra stale IP (502) olmasın.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /health {
        set $health_upstream backend:8000;
        proxy_pass http://$health_upstream/health;
        proxy_set_header Host $host;
    }

    location / {
        set $web_upstream frontend:80;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
    }
}
