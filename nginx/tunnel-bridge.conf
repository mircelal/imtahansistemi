# cloudflared konteynerində localhost:3002 → gateway (Cloudflare panelində https://localhost:3002).
# Cloudflare `http2Origin: true` göndərir — burada HTTP/2 dəstəyi vacibdir (520 xətasının qarşısı).
server {
    listen 3002 ssl;
    listen [::]:3002 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
